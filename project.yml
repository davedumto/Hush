name: JBLCompanion
options:
  bundleIdPrefix: com.davidejere
  deploymentTarget:
    macOS: "14.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  JBLCompanion:
    type: application
    platform: macOS
    sources:
      - path: JBLCompanion
        excludes:
          - "**/.gitkeep"
          - "Fonts/**"
      # A separate folder-reference source (blue folder in Xcode), not swept up by the group
      # above: a plain group flattens every file straight into Contents/Resources, which would
      # land the TTFs at Resources/Fredoka-Bold.ttf etc with no Fonts subfolder at all —
      # ATSApplicationFontsPath below expects Resources/Fonts/*.ttf specifically, so the
      # directory structure has to survive the copy.
      - path: JBLCompanion/Fonts
        type: folder
    info:
      path: JBLCompanion/Info.plist
      properties:
        CFBundleName: Hush
        CFBundleDisplayName: Hush
        CFBundleIconName: AppIcon
        # xcodegen writes this whole file fresh on every `generate` (its own default hardcodes
        # literal "1.0"/"1" here, found while testing scripts/build_dmg.sh — a prior direct edit
        # to the generated Info.plist got silently wiped on the next regenerate). These placeholders
        # make the About-box/bundle version actually track MARKETING_VERSION/CURRENT_PROJECT_VERSION
        # below, including a release build's MARKETING_VERSION= override.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: "Hush connects to your headphones and lets you control your JBL headphones from the menu bar."
        # Sparkle auto-update (AppDelegate's updaterController). The feed is appcast.xml served
        # raw off main (no separate hosting needed) — release.yml regenerates and commits it on
        # every tagged release. SUPublicEDKey is the public half of a key pair generated with
        # Sparkle's own `generate_keys` tool; it verifies update signatures and is not secret by
        # design — only the private half (used by release.yml via the SPARKLE_PRIVATE_KEY repo
        # secret to sign each release) needs to stay out of the repo.
        SUFeedURL: "https://raw.githubusercontent.com/davedumto/Hush/main/appcast.xml"
        SUPublicEDKey: "MGskS+M9sgWfozWHrbi+X1gLBETUz4rA1zqg8+dz0+M="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # design/DESIGN_GUIDE.md §2: fonts live in JBLCompanion/Fonts, copied into
        # Contents/Resources/Fonts (the folder-reference source above preserves the subfolder) and
        # registered process-wide from there at launch — no TTF needs its own Info.plist entry.
        ATSApplicationFontsPath: Fonts
    settings:
      base:
        # The actual built .app bundle/file name — previously left at the target's own default
        # ("JBLCompanion"), with only CFBundleDisplayName/CFBundleName set to "Hush" for the
        # system Bluetooth prompt. That was fine while nothing left this Mac, but a DMG download
        # should match the branding everywhere else (icon, dialogs, wordmark): Finder would
        # otherwise show "JBLCompanion.app" in /Applications. No code references this literal
        # name (verified), so renaming it is safe.
        PRODUCT_NAME: Hush
        # Decoupled from PRODUCT_NAME on purpose: PRODUCT_MODULE_NAME otherwise defaults to the
        # product name too, which would rename the Swift module and break every test file's
        # `@testable import JBLCompanion`. Only the user-facing app name changes.
        PRODUCT_MODULE_NAME: JBLCompanion
        PRODUCT_BUNDLE_IDENTIFIER: com.davidejere.JBLCompanion
        MARKETING_VERSION: "0.1.0"
        # Local/debug-build fallback only — scripts/build_dmg.sh overrides this with a real
        # increasing build number for every release build. Sparkle's update check compares THIS
        # value (CFBundleVersion), not MARKETING_VERSION, so a release that reused "1" here would
        # never be detected as newer than whatever the user already has installed.
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Sparkle
  JBLCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: JBLCompanionTests
    dependencies:
      - target: JBLCompanion
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
        # xcodegen's own default TEST_HOST is derived from the JBLCompanion *target's* name, not
        # its PRODUCT_NAME override — still literally "JBLCompanion.app" after PRODUCT_NAME was
        # set to Hush above, breaking `xcodebuild test` ("Could not find test host"). Xcode has no
        # live cross-target reference for this (it's always a baked-in literal, even from the
        # GUI), so this has to be updated by hand if PRODUCT_NAME ever changes again.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hush.app/Contents/MacOS/Hush"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  JBLCompanion:
    build:
      targets:
        JBLCompanion: all
        JBLCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JBLCompanionTests
