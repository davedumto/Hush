name: JBLCompanion
options:
  bundleIdPrefix: com.davidejere
  deploymentTarget:
    macOS: "14.0"
targets:
  JBLCompanion:
    type: application
    platform: macOS
    sources:
      - path: JBLCompanion
        excludes:
          - "**/.gitkeep"
          - "Fonts/**"
      # A separate folder-reference source (blue folder in Xcode), not swept up by the group
      # above: a plain group flattens every file straight into Contents/Resources, which would
      # land the TTFs at Resources/Fredoka-Bold.ttf etc with no Fonts subfolder at all —
      # ATSApplicationFontsPath below expects Resources/Fonts/*.ttf specifically, so the
      # directory structure has to survive the copy.
      - path: JBLCompanion/Fonts
        type: folder
    info:
      path: JBLCompanion/Info.plist
      properties:
        # Both explicit, not left to PRODUCT_NAME's own default (the target name, "JBLCompanion",
        # with no space) — that default is what the system Bluetooth permission prompt was
        # actually quoting ("JBLCompanion" would like to use Bluetooth), not CFBundleDisplayName,
        # even though that was already set. Set here as literal Info.plist values instead of
        # renaming PRODUCT_NAME itself, which would also rename the built .app bundle/file paths.
        CFBundleName: Hush
        CFBundleDisplayName: Hush
        CFBundleIconName: AppIcon
        LSUIElement: true
        NSBluetoothAlwaysUsageDescription: "Hush connects to your headphones and lets you control your JBL headphones from the menu bar."
        # design/DESIGN_GUIDE.md §2: fonts live in JBLCompanion/Fonts, copied into
        # Contents/Resources/Fonts (the folder-reference source above preserves the subfolder) and
        # registered process-wide from there at launch — no TTF needs its own Info.plist entry.
        ATSApplicationFontsPath: Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidejere.JBLCompanion
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  JBLCompanionTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: JBLCompanionTests
    dependencies:
      - target: JBLCompanion
    settings:
      base:
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  JBLCompanion:
    build:
      targets:
        JBLCompanion: all
        JBLCompanionTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JBLCompanionTests
